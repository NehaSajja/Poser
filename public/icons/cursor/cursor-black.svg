<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Black sculpted cursor</title>
  <defs>
    <path id="outline" d="M14 10.8 50.5 22.6Q53.3 23.6 50.7 24.7L39.5 29.3Q38.1 29.9 39.2 31L51 42.9Q53.3 45.2 51 47.5L47.2 51.3Q44.9 53.6 42.6 51.3L30.8 39.5Q29.8 38.5 29.2 39.8L24.3 51Q23 53.7 22.1 50.9L10.2 14.3Q8.6 9.1 14 10.8Z"/>
    <path id="face" d="M14.15 12.25 49.1 23.55 38.8 28Q36.3 29.15 38.25 31.1L50.1 43.75Q51.4 45.1 50.1 46.4L46.35 50.1Q45 51.45 43.65 50.1L31.7 38.2Q29.7 36.2 28.5 38.8L23.95 49.1 12.25 14.15Q11.25 11.25 14.15 12.25Z"/>
    <linearGradient id="rim" x1="15" y1="10" x2="44" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9399a1"/><stop offset=".23" stop-color="#50555d"/><stop offset=".66" stop-color="#25292f"/><stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="surface" x1="16" y1="13" x2="43" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555a60"/><stop offset=".48" stop-color="#393d43"/><stop offset="1" stop-color="#202328"/>
    </linearGradient>
    <linearGradient id="side" x1="13" y1="19" x2="42" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343941"/><stop offset=".52" stop-color="#161a20"/><stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="softLight" cx="19" cy="16" r="30" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 -4) scale(1 1.25)">
      <stop stop-color="#d2dae8" stop-opacity=".25"/><stop offset=".55" stop-color="#d2dae8" stop-opacity=".05"/><stop offset="1" stop-color="#d2dae8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="12" y1="11" x2="48" y2="50" gradientUnits="userSpaceOnUse">
