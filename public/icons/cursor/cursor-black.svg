    <use href="#outline" fill="url(#rim)" stroke="#0b0d11" stroke-width=".35" stroke-opacity=".5" stroke-linejoin="round"/>
    <use href="#face" fill="url(#surface)"/>
    <use href="#face" fill="url(#softLight)"/>
    <path d="M22.9 49.8 11.2 14Q10.05 10.4 13.8 11.6L49.9 23.3" stroke="url(#edge)" stroke-width=".65" stroke-linecap="round"/>
    <path d="M39 30.3 50.5 43.5Q52.15 45.15 50.5 46.8L46.6 50.7Q45 52.3 43.4 50.7L31.2 38.5" stroke="url(#edge)" stroke-opacity=".6" stroke-width=".55" stroke-linecap="round"/>
    <path d="M24.2 53.5 29.4 42.1M43.4 54.2Q45 55.4 46.7 54.1L51.4 49.4" stroke="#343941" stroke-opacity=".35" stroke-width=".45" stroke-linecap="round"/>
  </g>
  </g>
  </g>
