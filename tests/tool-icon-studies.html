<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbar icon options</title><style>
@font-face{font-family:Maru;src:url('/fonts/gt-maru/GTMaruRegular.ttf')}*{box-sizing:border-box}body{margin:0;background:oklch(99% 1% 93deg);color:#46433e;font:14px Maru,sans-serif;padding:28px 36px}h1{font-size:24px;font-weight:500;letter-spacing:-.04em;margin:0 0 6px}.intro{color:#858079;margin:0 0 22px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #00000014;border-radius:28px;padding:20px 14px}h2{font-size:16px;font-weight:500;margin:0 0 18px 8px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}button{font:inherit;color:inherit;cursor:pointer}.option{background:none;border:1px solid transparent;border-radius:18px;display:grid;justify-items:center;padding:10px 0;gap:8px;min-width:0;transition:background .15s,border-color .15s}.option:hover{background:#f7f6f2}.option[aria-pressed=true]{background:#f9f8f4;border-color:#00000014}.option img{width:88px;height:88px;max-width:100%}.label{font-size:11px;color:#817c75}.option[aria-pressed=true] .label{color:#37342e}.sizes{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:24px;padding-top:20px;border-top:1px solid #0000000a}.size{display:grid;justify-items:center;gap:7px;font-size:10px;color:#9b968d}.size div{height:32px;display:grid;place-items:center}.preview{margin-top:30px;display:grid;justify-items:center;gap:14px}.preview p{font-size:12px;color:#8b857d;margin:0}.tray{display:flex;align-items:center;gap:4px;padding:12px 18px;border:1px solid #00000014;border-radius:99px;background:oklch(99% 1% 93deg);box-shadow:inset 0 1px 0 #ffffffe6,0 6px 16px #00000006}.tool{width:38px;height:38px;display:grid;place-items:center}.tool img{width:28px;height:28px}.tool.active{background:white;border-radius:50%;box-shadow:0 1px 3px #00000014}.divider{height:22px;width:1px;background:#00000014;margin:0 10px}.tray svg{width:20px;height:20px;stroke:#8a8a8e;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.caption{font-size:11px;color:#a09b94;margin-top:22px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.option img{width:100px;height:100px}}
</style></head><body><h1>A matching set.</h1><p class="intro">Materials that belong to each tool. Choose a finish to preview the set.</p><div class="grid"><section class="card" data-tool="pencil"><h2>Pencil</h2><div class="options"><button class="option" aria-label="Yellow pencil" aria-pressed="true" data-finish="yellow"><img src="/icons/pencil/pencil-yellow.svg" alt=""><span class="label">Yellow</span></button><button class="option" aria-label="Cedar pencil" aria-pressed="false" data-finish="cedar"><img src="/icons/pencil/pencil-cedar.svg" alt=""><span class="label">Cedar</span></button><button class="option" aria-label="Graphite pencil" aria-pressed="false" data-finish="graphite"><img src="/icons/pencil/pencil-graphite.svg" alt=""><span class="label">Graphite</span></button></div><div class="sizes"><div class="size"><div><img data-sample src="/icons/pencil/pencil-yellow.svg" width="20" height="20" alt="20 pixel preview"></div><span>20px</span></div><div class="size"><div><img data-sample src="/icons/pencil/pencil-yellow.svg" width="24" height="24" alt="24 pixel preview"></div><span>24px</span></div><div class="size"><div><img data-sample src="/icons/pencil/pencil-yellow.svg" width="32" height="32" alt="32 pixel preview"></div><span>32px</span></div></div></section><section class="card" data-tool="frame"><h2>Frame</h2><div class="options"><button class="option" aria-label="Aluminum frame" aria-pressed="false" data-finish="aluminum"><img src="/icons/frame/frame-aluminum.svg" alt=""><span class="label">Aluminum</span></button><button class="option" aria-label="Oak frame" aria-pressed="false" data-finish="oak"><img src="/icons/frame/frame-oak.svg" alt=""><span class="label">Oak</span></button><button class="option" aria-label="Walnut frame" aria-pressed="true" data-finish="walnut"><img src="/icons/frame/frame-walnut.svg" alt=""><span class="label">Walnut</span></button></div><div class="sizes"><div class="size"><div><img data-sample src="/icons/frame/frame-walnut.svg" width="20" height="20" alt="20 pixel preview"></div><span>20px</span></div><div class="size"><div><img data-sample src="/icons/frame/frame-walnut.svg" width="24" height="24" alt="24 pixel preview"></div><span>24px</span></div><div class="size"><div><img data-sample src="/icons/frame/frame-walnut.svg" width="32" height="32" alt="32 pixel preview"></div><span>32px</span></div></div></section><section class="card" data-tool="cursor"><h2>Mouse pointer</h2><div class="options"><button class="option" aria-label="White mouse pointer" aria-pressed="true" data-finish="white"><img src="/icons/cursor/cursor-white.svg" alt=""><span class="label">White</span></button><button class="option" aria-label="Black mouse pointer" aria-pressed="false" data-finish="black"><img src="/icons/cursor/cursor-black.svg" alt=""><span class="label">Black</span></button><button class="option" aria-label="Silver mouse pointer" aria-pressed="false" data-finish="silver"><img src="/icons/cursor/cursor-silver.svg" alt=""><span class="label">Silver</span></button></div><div class="sizes"><div class="size"><div><img data-sample src="/icons/cursor/cursor-white.svg" width="20" height="20" alt="20 pixel preview"></div><span>20px</span></div><div class="size"><div><img data-sample src="/icons/cursor/cursor-white.svg" width="24" height="24" alt="24 pixel preview"></div><span>24px</span></div><div class="size"><div><img data-sample src="/icons/cursor/cursor-white.svg" width="32" height="32" alt="32 pixel preview"></div><span>32px</span></div></div></section></div><div class="preview"><p>Toolbar preview</p><div class="tray"><span class="tool "><img data-preview="cursor" src="/icons/cursor/cursor-white.svg" alt="cursor"></span><span class="tool active"><img data-preview="pencil" src="/icons/pencil/pencil-yellow.svg" alt="pencil"></span><span class="tool "><img data-preview="eraser" src="/icons/eraser/eraser-rose.svg" alt="eraser"></span><span class="tool "><img data-preview="frame" src="/icons/frame/frame-walnut.svg" alt="frame"></span><span class="divider"></span><span class="tool"><svg viewBox="0 0 24 24"><path d="M9 5 5 9l4 4M5 9h9a5 5 0 0 1 0 10"/></svg></span><span class="tool"><svg viewBox="0 0 24 24"><path d="M6 7h12M10 4h4M8 7l.7 12h6.6L16 7M10.5 10v6M13.5 10v6"/></svg></span><span class="divider"></span><span class="tool"><svg viewBox="0 0 24 24"><path d="m5 5 5 5M10 5v5H5m14 9-5-5m0 5v-5h5"/></svg></span></div></div><p class="caption">Lacquer & cedar · Aluminum & wood · Classic pointers · Editable SVGs</p><script>
document.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>{const card=button.closest('.card'), tool=card.dataset.tool, finish=button.dataset.finish, src=`/icons/${tool}/${tool}-${finish}.svg`;card.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));card.querySelectorAll('[data-sample]').forEach(img=>img.src=src);document.querySelector(`[data-preview="${tool}"]`).src=src;}));
</script></body></html>
